# nsjail_bindmounts.conf — Read-only bindmounts for nsjail sandbox
#
# Format: one mount per line (host_path:sandbox_path)
# Empty lines and lines starting with '#' are ignored.
#
# SECURITY: Only mount what runtimes strictly need. Blanket mounts like
# /etc or /proc expose secrets and host information to sandboxed code.

# ─────────────────────────────────────────────────────────────────────────
# System libraries and linker
# ─────────────────────────────────────────────────────────────────────────
/usr/lib:/usr/lib
/usr/lib64:/usr/lib64
/usr/libexec:/usr/libexec
/lib:/lib
/lib64:/lib64

# C/C++ headers
/usr/include:/usr/include

# Compiler/runtime binaries
/usr/bin:/usr/bin
/bin:/bin

# Shared data (Java policies, Go templates, locale, etc.)
/usr/share:/usr/share

# ─────────────────────────────────────────────────────────────────────────
# /etc — selective mounts only (NOT the full directory)
# Full /etc would expose /etc/shadow, /etc/hostname, environment files.
# ─────────────────────────────────────────────────────────────────────────
/etc/ld.so.cache:/etc/ld.so.cache
/etc/ld.so.conf:/etc/ld.so.conf
/etc/ld.so.conf.d:/etc/ld.so.conf.d
/etc/alternatives:/etc/alternatives
/etc/ssl/certs:/etc/ssl/certs
/etc/localtime:/etc/localtime
/etc/nsswitch.conf:/etc/nsswitch.conf
/etc/passwd:/etc/passwd
# JDK security config
/etc/java-17-openjdk:/etc/java-17-openjdk
# Mono runtime config
/etc/mono:/etc/mono
# FreePascal config
/etc/fpc.cfg:/etc/fpc.cfg
/etc/fpc-3.2.2.cfg:/etc/fpc-3.2.2.cfg

# /proc — read-only bindmount. Required by JVM (/proc/self/exe),
# Mono, rustc, and GHC. Combined with --disable_proc in nsjail args,
# this mounts the host /proc as read-only WITHOUT creating a new procfs.
# The sandbox process sees host PIDs but cannot write to /proc.
/proc:/proc

# Random sources
/dev/urandom:/dev/urandom
/dev/null:/dev/null

# ─────────────────────────────────────────────────────────────────────────
# Language toolchains
# ─────────────────────────────────────────────────────────────────────────
# /usr/local/bin for symlinks (kotlinc, rustc, etc.)
/usr/local/bin:/usr/local/bin
# Cargo: bind only the bin and standard registry. Avoid the full tree
# which can contain credentials.toml from any registry login.
/usr/local/cargo/bin:/usr/local/cargo/bin
/usr/local/rustup:/usr/local/rustup
/opt/kotlinc:/opt/kotlinc
# GHC package database (copied from /usr/lib/ghc/package.conf.d at build time)
/opt/ghc-pkgdb:/opt/ghc-pkgdb
